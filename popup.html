<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<style>
  body{width:390px;margin:0;padding:16px;font-family:-apple-system,"Segoe UI",Roboto,sans-serif;background:#0f172a;color:#f8fafc}
  h2{margin:0 0 10px;font-size:16px;color:#facc15}
  .card{background:#1e293b;border:1px solid #334155;border-radius:8px;padding:12px;margin-bottom:12px;font-size:12px}
  .badge{display:inline-block;padding:2px 8px;border-radius:999px;font-weight:600;font-size:11px}
  .ok{background:#065f46;color:#6ee7b7}.warn{background:#78350f;color:#fde68a}
  input[type=file],input[type=text]{width:100%;box-sizing:border-box;margin-top:6px;padding:6px;background:#0f172a;border:1px solid #475569;color:#f8fafc;border-radius:6px;font-size:12px}
  button{width:100%;padding:10px;border:none;border-radius:8px;background:#facc15;color:#0f172a;font-weight:700;cursor:pointer;font-size:13px;margin-bottom:6px}
  button.secondary{background:#334155;color:#f8fafc;font-weight:500;font-size:12px;padding:6px}
  button:disabled{opacity:.5;cursor:not-allowed}
  progress{width:100%;height:10px;margin-top:8px}
  #log{max-height:120px;overflow-y:auto;font-family:monospace;font-size:11px;color:#94a3b8;margin-top:8px;white-space:pre-wrap}
  code{color:#38bdf8}
</style>
</head>
<body>
<h2>Blinkit Bulk Invoice Zipper</h2>

<div class="card">
  <div>Session auth: <span id="authStatus" class="badge warn">Checking…</span></div>
  <div style="margin-top:6px">Invoice endpoint: <span id="endpointStatus" class="badge warn">Not captured</span></div>
  <div style="margin-top:6px;color:#94a3b8">Keep a <b>blinkit.com</b> tab active. Open one order and click “Download invoice” once to capture the endpoint.</div>
  <button class="secondary" id="clearBtn" style="margin-top:8px">Clear captured session data</button>
</div>

<div class="card">
  <label><b>1. Orders JSON</b></label>
  <input type="file" id="jsonFile" accept=".json" />
  <div id="orderCount" style="margin-top:6px;color:#38bdf8">0 orders loaded</div>
</div>

<div class="card">
  <label><b>2. Endpoint template</b> (use <code>{orderId}</code> and <code>{cartId}</code>)</label>
  <input type="text" id="urlTemplate" placeholder="https://blinkit.com/.../{orderId}/invoice?cart_id={cartId}" />
</div>

<button id="startBtn" disabled>Download &amp; Zip All Invoices</button>
<button id="testBtn" class="secondary" disabled>Test with first order only</button>
<progress id="progressBar" value="0" max="100" style="display:none"></progress>
<div id="log"></div>

<script src="jszip.min.js"></script>
<script src="popup.js"></script>
</body>
</html>
